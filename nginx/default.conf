server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in headers and error pages.
    server_tokens off;

    # Security headers
    include /etc/nginx/snippets/security-headers.conf;

    # Compress text responses
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets for a week; HTML is always revalidated.
    location ~* \.(css|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
        # add_header in a location replaces ALL headers inherited from the server
        # block, so the security headers must be included again here.
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Liveness endpoint for Docker HEALTHCHECK, load balancers and the CI smoke test.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
}
