name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Cancel an older run of the same branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate HTML
        run: npx --yes html-validate@8 index.html 404.html

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Lint shell scripts
        run: shellcheck tests/*.sh

  build:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t devops-webapp:ci \
            --build-arg GIT_SHA=${GITHUB_SHA::7} \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) .

      - name: Start container
        run: docker run -d --name web -p 8080:8080 devops-webapp:ci

      - name: Smoke test
        run: tests/smoke.sh http://localhost:8080

      - name: Container health
        run: |
          for i in $(seq 1 20); do
            state=$(docker inspect -f '{{.State.Health.Status}}' web)
            echo "health: $state"
            [ "$state" = healthy ] && exit 0
            sleep 3
          done
          docker logs web
          exit 1

      - name: Container logs
        if: failure()
        run: docker logs web

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: devops-webapp:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  notify:
    needs: [lint, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Notification
        # Forks and repos without the secret would otherwise fail on an empty URL.
        if: ${{ env.SLACK_WEBHOOK != '' }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          RESULT: ${{ needs.build.result == 'success' && needs.lint.result == 'success' && 'success ✅' || 'failed ❌' }}
        run: |
          curl -fsS -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"CI Pipeline ${RESULT} on ${GITHUB_REF_NAME} (${GITHUB_SHA::7}): ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
          "$SLACK_WEBHOOK"
